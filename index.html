<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="app-build" content="2026-08-17-region-dropdown-row-edit-delete-v1">
<title>Region</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    padding:2rem 1rem 4rem;
    background:#f5f7fa;
    color:#0f172a;
    font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
    width:min(100%,1100px);
    margin:auto;
    padding:2rem 1.8rem;
    background:#fff;
    border-radius:32px;
    box-shadow:0 20px 40px -12px rgba(15,23,42,.15)
}
.page-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:1.6rem;
    padding-bottom:.7rem;
    border-bottom:2px solid #e9edf4;
    color:#1e293b;
    font-size:2.2rem;
    font-weight:600;
    letter-spacing:-.5px
}
.cloud-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-left:4px;
    padding:.3rem .9rem;
    border-radius:999px;
    background:#f1f5f9;
    color:#475569;
    font-size:.82rem;
    font-weight:500
}
.status-dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:1.8rem;
    padding-bottom:1rem;
    border-bottom:1px solid #e9edf4
}
.toolbar-group{display:flex;flex-wrap:wrap;gap:9px}
.btn{
    padding:.45rem 1.15rem;
    border:1px solid #d1d9e6;
    border-radius:999px;
    background:#fff;
    color:#334155;
    font-size:.86rem;
    font-weight:600;
    transition:.15s
}
.btn:hover{background:#f1f5f9;border-color:#94a3b8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sync{border-color:#2563eb;background:#2563eb;color:#fff}
.btn-sync:hover{background:#1d4ed8}
.last-sync{color:#94a3b8;font-size:.8rem}

.add-section{
    margin-bottom:2.2rem;
    padding:1.55rem 1.5rem;
    border:1px solid #e2e8f0;
    border-radius:24px;
    background:#f8fafc
}
.add-section h2{margin-bottom:1rem;font-size:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full-width{grid-column:1/-1}
.form-group label{
    color:#475569;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.04em
}
.form-group input,.form-group select{
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none
}
.form-group input:focus,.form-group select:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent
}

.remark-combo{position:relative}
.remark-primary-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 44px;
    gap:7px
}
.remark-primary-row input{
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none
}
.remark-primary-row input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent
}
.remark-toggle{
    min-height:44px;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#475569;
    font-weight:700
}
.remark-toggle:hover{background:#f1f5f9}
.remark-panel{
    position:absolute;
    left:0;
    right:0;
    top:calc(44px + 7px);
    z-index:900;
    max-height:285px;
    overflow-y:auto;
    padding:.55rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    box-shadow:0 15px 30px rgba(15,23,42,.14)
}
.remark-panel.hidden{display:none!important}
.remark-option-list{
    display:flex;
    flex-direction:column;
    width:100%
}
.remark-option-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center;
    gap:6px;
    width:100%;
    padding:.28rem 0;
    border-bottom:1px solid #eef2f7
}
.remark-option-row:last-child{border-bottom:0}
.remark-option{
    min-width:0;
    width:100%;
    padding:.5rem .6rem;
    border:0;
    border-radius:9px;
    background:#fff;
    color:#0f172a;
    text-align:left;
    overflow-wrap:anywhere
}
.remark-option:hover,.remark-option:focus-visible{background:#f1f5f9;outline:none}
.remark-option[aria-selected="true"]{color:#1d4ed8;font-weight:650}
.remark-option-edit,.remark-option-delete{
    padding:.42rem .58rem;
    border:0;
    border-radius:9px;
    font-size:.76rem;
    font-weight:650;
    white-space:nowrap
}
.remark-option-edit{background:#eff6ff;color:#1d4ed8}
.remark-option-edit:hover{background:#dbeafe}
.remark-option-delete{background:#fff1f2;color:#be123c}
.remark-option-delete:hover{background:#ffe4e6}
.remark-empty{
    padding:.65rem;
    color:#94a3b8;
    text-align:center;
    font-size:.82rem
}
.selected-remarks{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:.62rem
}
.selected-remark{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:32px;
    padding:.38rem .62rem;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:#f8fafc;
    color:#0f172a;
    font-size:.86rem;
    font-weight:600;
    box-shadow:0 1px 2px rgba(15,23,42,.04)
}
.selected-remark-remove{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border:0;
    border-radius:4px;
    background:#e2e8f0;
    color:#64748b;
    font-size:.95rem;
    line-height:1;
    padding:0
}
.selected-remark-remove:hover{background:#fee2e2;color:#dc2626}

.add-button{
    grid-column:1/-1;
    min-height:46px;
    margin-top:.2rem;
    border:0;
    border-radius:999px;
    background:#1e293b;
    color:#fff;
    font-weight:700
}
.add-button:hover{background:#0f172a}

.list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:1.8rem 0 .8rem
}
.list-header h2{font-size:1.4rem}
.count-badge{
    min-width:38px;
    padding:.22rem .8rem;
    border-radius:999px;
    background:#e9edf4;
    text-align:center;
    font-size:.8rem;
    font-weight:650
}
.table-wrapper{
    overflow-x:auto;
    border:1px solid #e9edf4;
    border-radius:20px
}
.region-table{
    width:100%;
    border-collapse:collapse;
    font-size:.95rem
}
.region-table th{
    padding:.9rem 1.2rem;
    border-bottom:2px solid #d1d9e6;
    background:#f1f5f9;
    color:#1e293b;
    text-align:left;
    font-weight:600
}
.region-table td{
    padding:.85rem 1.2rem;
    border-bottom:1px solid #eef2f6;
    vertical-align:top;
    line-height:1.5
}
.region-table tbody tr:last-child td{border-bottom:0}
.region-table tbody tr:hover{background:#fafcff}
.region-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1rem;
    width:100%
}
.region-name{
    min-width:0;
    color:#0f172a;
    font-size:1rem;
    font-weight:700;
    line-height:1.5;
    overflow-wrap:anywhere
}
.region-edit-link{
    flex:0 0 auto;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    background:none;
    box-shadow:none;
    color:#64748b;
    font-family:'Segoe UI',Roboto,system-ui,sans-serif;
    font-size:.8rem;
    font-weight:500;
    line-height:1.5;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    transition:color .15s
}
.region-edit-link:hover,
.region-edit-link:focus-visible{
    background:none;
    box-shadow:none;
    color:#1e3a8a;
    outline:none
}
.region-remarks{
    margin-top:.32rem;
    color:#334155;
    font-weight:400
}
.region-remark{
    display:block;
    overflow-wrap:anywhere
}
.col-action{
    width:120px;
    text-align:center;
    white-space:nowrap
}
.action-btn{
    margin:0 2px;
    padding:.28rem .72rem;
    border:0;
    border-radius:999px;
    font-size:.82rem;
    font-weight:650
}
.edit-btn{background:#dbeafe;color:#1e3a8a}
.edit-btn:hover{background:#bfdbfe}
.delete-btn{background:#fee2e2;color:#991b1b}
.delete-btn:hover{background:#fecaca}
.empty-row td{
    padding:2.6rem 1rem;
    background:#fafcff;
    color:#94a3b8;
    text-align:center
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
            max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(5px)
}
.dialog{
    width:min(94vw,600px);
    max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:26px;
    background:#fff;
    box-shadow:0 30px 70px rgba(15,23,42,.28)
}
.dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
    padding:1.7rem 1.7rem 1rem
}
.dialog-scroll::-webkit-scrollbar{width:9px}
.dialog-scroll::-webkit-scrollbar-track{background:#f1f5f9}
.dialog-scroll::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border:2px solid #f1f5f9;
    border-radius:999px
}

/* Region 配置/编辑弹窗：内容超出视口时在正文区域滚动，底部操作栏保持可见 */
#configModal .dialog-scroll,
#editModal .dialog-scroll{
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#cbd5e1 #f1f5f9
}
#configModal .dialog-scroll::-webkit-scrollbar,
#editModal .dialog-scroll::-webkit-scrollbar{width:9px}
#configModal .dialog-scroll::-webkit-scrollbar-track,
#editModal .dialog-scroll::-webkit-scrollbar-track{background:#f1f5f9}
#configModal .dialog-scroll::-webkit-scrollbar-thumb,
#editModal .dialog-scroll::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border:2px solid #f1f5f9;
    border-radius:999px
}
.dialog h3{margin-bottom:.45rem;font-size:1.3rem}
.dialog-desc{
    margin-bottom:1rem;
    padding-bottom:.8rem;
    border-bottom:1px solid #e2e8f0;
    color:#64748b;
    font-size:.86rem;
    line-height:1.6
}
.dialog .form-group{margin-bottom:1rem}
.dialog-actions{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:.95rem 1.7rem max(.95rem,env(safe-area-inset-bottom));
    border-top:1px solid #e8edf4;
    background:#fff;
    box-shadow:0 -8px 20px rgba(15,23,42,.05)
}
.dialog-btn{
    padding:.55rem 1.5rem;
    border:0;
    border-radius:999px;
    font-weight:650
}
.dialog-btn.secondary{background:#f1f5f9;color:#334155}
.dialog-btn.danger{background:#fee2e2;color:#991b1b}
.dialog-btn.danger:hover{background:#fecaca}
.dialog-btn.primary{background:#1e293b;color:#fff}
.dialog-btn.primary:hover{background:#0f172a}
#editModal .dialog-actions .danger{margin-right:auto}

.history-list{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid #e2e8f0;
    border-radius:16px
}
.history-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:8px;
    align-items:center;
    padding:.65rem .75rem;
    background:#fff
}
.history-row+.history-row{border-top:1px solid #e2e8f0}
.history-row input{
    width:100%;
    min-height:38px;
    padding:.5rem .7rem;
    border:1px solid #cbd5e1;
    border-radius:10px
}
.history-btn{
    padding:.4rem .68rem;
    border:0;
    border-radius:999px;
    font-size:.78rem;
    font-weight:650
}
.history-save{background:#dbeafe;color:#1e3a8a}
.history-delete{background:#fee2e2;color:#991b1b}
.history-empty{
    padding:1.2rem;
    color:#94a3b8;
    text-align:center
}

.token-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:8px
}
.token-btn{
    border:1px solid #d1d9e6;
    border-radius:12px;
    background:#f8fafc;
    color:#334155;
    padding:.66rem .85rem;
    font-size:.82rem;
    font-weight:700;
    white-space:nowrap
}
.token-btn.danger{
    color:#991b1b;
    background:#fff7f7;
    border-color:#fecaca
}
.token-btn:disabled{opacity:.45;cursor:not-allowed}
.hint{
    margin-top:.4rem;
    color:#94a3b8;
    font-size:.76rem;
    line-height:1.5
}
.hint a{color:#2563eb;text-decoration:none}

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:1500;
    max-width:min(90vw,680px);
    padding:.78rem 1.5rem;
    transform:translateX(-50%);
    border-radius:999px;
    background:#2563eb;
    color:#fff;
    font-size:.88rem;
    font-weight:600;
    text-align:center;
    box-shadow:0 12px 34px rgba(15,23,42,.25)
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#2563eb}

.back-to-top{
    position:fixed;
    right:16px;
    top:70%;
    z-index:900;
    padding:.45rem .72rem;
    transform:translateY(-50%);
    border:1px solid rgba(148,163,184,.45);
    border-radius:999px;
    background:rgba(255,255,255,.82);
    color:#64748b;
    font-size:.76rem;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s
}
.back-to-top.visible{opacity:.55;visibility:visible;pointer-events:auto}
.back-to-top:hover{opacity:1}

@media(max-width:700px){
    body{padding:.8rem}
    .container{padding:1.25rem;border-radius:22px}
    .page-title{font-size:1.8rem}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-group{justify-content:center}
    .last-sync{text-align:center}
    .form-grid{grid-template-columns:1fr}
    .form-group.full-width{grid-column:auto}
    .region-table th,.region-table td{padding:.65rem .8rem;font-size:.88rem}
    .region-title-row{gap:.75rem}
    .dialog{
        width:100%;
        max-height:calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius:20px
    }
    .dialog-scroll{padding:1.2rem 1.2rem .8rem}
    .dialog-actions{padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom))}
    .dialog-actions .dialog-btn{flex:1}
    #editModal .dialog-actions .dialog-btn{flex:0 0 auto}

    /* 手机端配置：占满“实际可视区域”，表单独立滚动，底部保存栏永远保留。
       不再依赖 max-height + flex 的隐式高度计算。 */
    #configModal{
        top:var(--config-vtop,0px);
        right:0;
        bottom:auto;
        left:0;
        width:100%;
        height:var(--config-vh,100vh);
        height:var(--config-vh,100dvh);
        padding:0;
        align-items:stretch;
        justify-content:stretch;
        overflow:hidden
    }
    #configModal .dialog{
        width:100%;
        max-width:none;
        height:100%;
        max-height:none;
        margin:0;
        display:grid;
        grid-template-rows:minmax(0,1fr) auto;
        overflow:hidden;
        border-radius:0
    }
    #configModal .dialog-scroll{
        min-width:0;
        min-height:0;
        width:100%;
        overflow-x:hidden;
        overflow-y:scroll;
        overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-y;
        scrollbar-gutter:stable;
        padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem 1rem
    }
    #configModal .dialog-actions{
        min-width:0;
        flex:none;
        position:relative;
        z-index:2;
        padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom));
        background:#fff;
        box-shadow:0 -8px 20px rgba(15,23,42,.08)
    }
    #configModal .dialog-actions .dialog-btn{
        min-height:44px;
        flex:1
    }
    .token-row{grid-template-columns:minmax(0,1fr) auto}
    .token-btn.danger{grid-column:1/-1}
    .history-row{grid-template-columns:1fr auto}
    .history-delete{grid-column:2}
    .back-to-top{right:8px}
}
</style>
</head>
<body>
<main class="container">
    <h1 class="page-title">
        Region
        <span class="cloud-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未配置</span>
        </span>
    </h1>

    <section class="toolbar">
        <div class="toolbar-group">
            <button class="btn btn-sync hidden" id="syncBtn" type="button">同步</button>
            <button class="btn" id="configBtn" type="button">配置</button>
            <button class="btn" id="exportBtn" type="button">导出</button>
            <button class="btn hidden" id="importBtn" type="button">导入</button>
            <input type="file" id="fileInput" accept=".json,application/json" hidden>
        </div>
        <span class="last-sync" id="lastSyncTime">未同步</span>
    </section>

    <section class="add-section hidden" id="addSection">
        <h2>添加</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="regionInput">区划</label>
                <input id="regionInput" type="text" autocomplete="off" autofocus>
            </div>

            <div class="form-group">
                <label for="remarkInput">备注</label>
                <div class="remark-combo" id="remarkCombo">
                    <div class="remark-primary-row">
                        <input id="remarkInput" type="text" autocomplete="off">
                        <button class="remark-toggle" id="remarkTrigger" type="button" aria-label="展开备注历史">▾</button>
                    </div>
                    <div class="remark-panel hidden" id="remarkPanel">
                        <div id="remarkOptions"></div>
                    </div>
                    <div class="selected-remarks" id="remarkSelected"></div>
                </div>
            </div>

            <button class="add-button" id="addBtn" type="button">添加</button>
        </div>
    </section>

    <section>
        <div class="list-header">
            <h2>总表</h2>
            <span class="count-badge" id="countDisplay">0</span>
        </div>
        <div class="table-wrapper">
            <table class="region-table">
                <thead>
                    <tr>
                        <th>区划</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row"><td colspan="2">暂无条目</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<section class="overlay hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
    <div class="dialog">
        <div class="dialog-scroll">
            <h3 id="editHeading">编辑条目</h3>
            <div class="form-group">
                <label for="editRegion">区划</label>
                <input id="editRegion" type="text" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="editRemarkInput">备注</label>
                <div class="remark-combo" id="editRemarkCombo">
                    <div class="remark-primary-row">
                        <input id="editRemarkInput" type="text" autocomplete="off">
                        <button class="remark-toggle" id="editRemarkTrigger" type="button" aria-label="展开备注历史">▾</button>
                    </div>
                    <div class="remark-panel hidden" id="editRemarkPanel">
                        <div id="editRemarkOptions"></div>
                    </div>
                    <div class="selected-remarks" id="editRemarkSelected"></div>
                </div>
            </div>
        </div>
        <div class="dialog-actions">
            <button class="dialog-btn danger" id="editDelete" type="button">删除</button>
            <button class="dialog-btn secondary" id="editCancel" type="button">取消</button>
            <button class="dialog-btn primary" id="editSave" type="button">保存</button>
        </div>
    </div>
</section>

<section class="overlay hidden" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configHeading">
    <form class="dialog" id="configForm" autocomplete="on">
        <div class="dialog-scroll">
            <h3 id="configHeading">GitHub 云端配置</h3>
            <p class="dialog-desc">所有访客均可直接读取同目录下的 region_data.json，无需 Token。只有添加、编辑、删除、导入和同步时需要管理 Token；保存配置前会先验证 Token 和目标仓库。</p>

            <div class="form-group">
                <label for="cfgSavedToken">已保存 Token</label>
                <div class="token-row">
                    <select id="cfgSavedToken"><option value="">新增 Token</option></select>
                    <button class="token-btn" id="cfgNewTokenBtn" type="button">新增</button>
                    <button class="token-btn danger" id="cfgDeleteTokenBtn" type="button" disabled>删除</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cfgTokenName">Token 名称</label>
                <input id="cfgTokenName" type="text" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="cfgToken">GitHub Personal Access Token *</label>
                <input id="cfgToken" name="github-token-new" type="password" autocomplete="new-password" spellcheck="false">
                <div class="hint">建议使用仅授权目标仓库，并具有 Contents: Read and write 权限的细粒度 Token。</div>
            </div>

            <div class="form-group">
                <label for="cfgOwner">仓库所有者 *</label>
                <input id="cfgOwner" name="github-owner" type="text" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="cfgRepo">仓库名称 *</label>
                <input id="cfgRepo" type="text">
            </div>

            <div class="form-group">
                <label for="cfgFile">数据文件名</label>
                <input id="cfgFile" type="text" value="region_data.json">
            </div>
        </div>
        <div class="dialog-actions">
            <button class="dialog-btn secondary" id="configCancel" type="button">取消</button>
            <button class="dialog-btn primary" id="configSave" type="submit">保存并连接</button>
        </div>
    </form>
</section>

<button class="back-to-top" id="backToTopBtn" type="button">↑</button>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';

// ---------- 页面实例与本地键 ----------
function pageIdentity(){
    let p=(location.pathname||'/').replace(/\\/g,'/').replace(/\/+/g,'/').replace(/\/(?:index\.html?)$/i,'/');
    if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);
    return `${location.origin}${p}`;
}
function hashIdentity(value){
    let hash=0x811c9dc5;
    for(let i=0;i<value.length;i++){
        hash^=value.charCodeAt(i);
        hash=Math.imul(hash,0x01000193);
    }
    return (hash>>>0).toString(16).padStart(8,'0');
}

const NS=`region_app:${hashIdentity(pageIdentity())}`;
const STATE_KEY=`${NS}:state_v1`;
const CONFIG_KEY=`${NS}:config_v1`;
const TOKEN_KEY=`${NS}:token_profiles_v1`;
const META_KEY=`${NS}:sync_meta_v1`;
const BACKUP_KEY=`${NS}:backups_v1`;
const PUBLIC_FILE='region_data.json';
const MAX_SYNC=750*1024;
const AUTO_DELAY=700;
const API_VERSION='2026-03-10';

const $=id=>document.getElementById(id);
const statusDot=$('statusDot'),statusText=$('statusText'),syncBtn=$('syncBtn'),configBtn=$('configBtn'),
exportBtn=$('exportBtn'),importBtn=$('importBtn'),fileInput=$('fileInput'),lastSyncTime=$('lastSyncTime'),
addSection=$('addSection'),
regionInput=$('regionInput'),remarkCombo=$('remarkCombo'),remarkInput=$('remarkInput'),remarkTrigger=$('remarkTrigger'),
remarkPanel=$('remarkPanel'),remarkOptions=$('remarkOptions'),
remarkSelected=$('remarkSelected'),addBtn=$('addBtn'),tableBody=$('tableBody'),
countDisplay=$('countDisplay'),editModal=$('editModal'),editRegion=$('editRegion'),editRemarkCombo=$('editRemarkCombo'),
editRemarkInput=$('editRemarkInput'),editRemarkTrigger=$('editRemarkTrigger'),editRemarkPanel=$('editRemarkPanel'),
editRemarkOptions=$('editRemarkOptions'),
editRemarkSelected=$('editRemarkSelected'),editDelete=$('editDelete'),editCancel=$('editCancel'),
editSave=$('editSave'),configModal=$('configModal'),configForm=$('configForm'),
cfgSavedToken=$('cfgSavedToken'),cfgNewTokenBtn=$('cfgNewTokenBtn'),cfgDeleteTokenBtn=$('cfgDeleteTokenBtn'),
cfgTokenName=$('cfgTokenName'),cfgToken=$('cfgToken'),cfgOwner=$('cfgOwner'),cfgRepo=$('cfgRepo'),
cfgFile=$('cfgFile'),configCancel=$('configCancel'),configSave=$('configSave'),
backToTopBtn=$('backToTopBtn'),toast=$('toast');

let state={entries:[],remarks:[]};
let addSelected=[];
let editSelected=[];
let editingId='';
let editInitialSnapshot='';
let editOverlayPointerDown=false;
let profiles=[];
let selectedProfileId='';
let config={token:'',tokenName:'',activeTokenId:'',owner:'',repo:'',file:'region_data.json'};
let meta=emptyMeta();
let syncing=false;
let syncQueued=false;
let autoTimer=null;
let toastTimer=null;
let hasStored=false;

// ---------- 通用工具 ----------
function clean(v){return String(v??'').normalize('NFKC').trim()}
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function attr(v){return esc(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function uid(){return crypto?.randomUUID?crypto.randomUUID():`region_${Date.now()}_${Math.random().toString(36).slice(2,9)}`}
function key(v){return clean(v).toLocaleLowerCase('zh-CN')}
function normalizeToken(value){
    return String(value??'')
        .replace(/^\s*(?:Bearer|token)\s+/i,'')
        .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
        .replace(/[\s"'`]+/g,'')
        .trim()
}

const numericCollator=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});
const regionCollator=new Intl.Collator('zh-CN-u-co-pinyin',{numeric:true,sensitivity:'base'});

function uniq(values){
    const map=new Map();
    for(const raw of values||[]){
        const value=clean(raw);
        if(value&&!map.has(key(value)))map.set(key(value),value);
    }
    return [...map.values()];
}
function sortRemarks(values){
    // 只允许用于“备注历史/下拉候选”的数字升序。
    return uniq(values).sort((a,b)=>numericCollator.compare(clean(a),clean(b)));
}
function orderedEntryRemarks(item){
    // remarkOrder 是条目内部备注顺序的权威字段。
    // 兼容旧数据：没有 remarkOrder 时才回退到旧 remarks 数组，并保持数组原顺序。
    if(!item||typeof item!=='object')return[];
    const source=Array.isArray(item.remarkOrder)
        ? item.remarkOrder
        : (Array.isArray(item.remarks)?item.remarks:[]);
    return uniq(source);
}
function normalizeEntry(item){
    if(!item||typeof item!=='object')return null;
    const region=clean(item.region);
    if(!region)return null;
    const orderedRemarks=orderedEntryRemarks(item);
    return{
        id:clean(item.id)||uid(),
        region,
        remarks:[...orderedRemarks],
        remarkOrder:[...orderedRemarks]
    };
}
function normalizeState(value){
    const source=Array.isArray(value)?{entries:value}:(value&&typeof value==='object'?value:{});
    const entries=(Array.isArray(source.entries)?source.entries:[])
        .map(normalizeEntry)
        .filter(Boolean)
        .sort((a,b)=>{
            const byRegion=regionCollator.compare(a.region,b.region);
            if(byRegion!==0)return byRegion;
            return String(a.id).localeCompare(String(b.id));
        });

    const history=Array.isArray(source.remarks)
        ? sortRemarks(source.remarks)
        : sortRemarks(entries.flatMap(item=>item.remarks));

    return{schemaVersion:2,entries,remarks:history};
}
function fingerprint(value=state){
    const normalized=normalizeState(value);
    return JSON.stringify({
        schemaVersion:2,
        entries:normalized.entries.map(x=>({
            id:x.id,
            region:x.region,
            remarks:x.remarks,
            remarkOrder:x.remarkOrder
        })),
        remarks:normalized.remarks
    });
}
function serialize(value=state){return JSON.stringify(normalizeState(value),null,2)}
function assertSize(value=state){
    const bytes=new TextEncoder().encode(serialize(value)).length;
    if(bytes>MAX_SYNC)throw new Error(`数据约 ${Math.ceil(bytes/1024)} KB，超过 750 KB 的安全同步上限`);
}
function pathEncode(path){return String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/')}
function toB64(text){
    const bytes=new TextEncoder().encode(text);
    let binary='';
    for(let i=0;i<bytes.length;i+=0x8000){
        binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    }
    return btoa(binary);
}
function fromB64(value){
    const binary=atob(String(value||'').replace(/\s/g,''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
}
function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,v);return true}catch(e){showToast(`本地保存失败：${e.message}`,'error');return false}}
function lr(k){try{localStorage.removeItem(k)}catch(e){}}
function showToast(message,type='info'){
    toast.textContent=message;
    toast.className=`toast ${type}`;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.add('hidden'),3000);
}
function setStatus(kind,text){
    statusDot.className=`status-dot ${kind}`;
    statusText.textContent=text;
}
function pageBasePath(){
    return location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]*$/,'');
}
function publicDataUrl(){
    return `${location.origin}${pageBasePath()}${PUBLIC_FILE}?v=${Date.now()}`;
}
function admin(){return validConfig()}
function updateAdminUI(){
    const on=admin();
    addSection.classList.toggle('hidden',!on);
    syncBtn.classList.toggle('hidden',!on);
    importBtn.classList.toggle('hidden',!on);
}

// ---------- 本地数据 ----------
function saveLocal(){
    state=normalizeState(state);
    ls(STATE_KEY,JSON.stringify(state));
}
function loadLocal(){
    const stored=lg(STATE_KEY);
    hasStored=stored!==null;
    if(!stored){
        state={entries:[],remarks:[]};
    }else{
        try{state=normalizeState(JSON.parse(stored))}
        catch(e){state={entries:[],remarks:[]}}
    }
    render();
}
function addRemarkHistory(value){
    const v=clean(value);
    if(!v)return;
    state.remarks=sortRemarks([...state.remarks,v]);
}

// ---------- 备注下拉 ----------
function getRemarkContext(which){
    const isAdd=which==='add';
    return{
        input:isAdd?remarkInput:editRemarkInput,
        panel:isAdd?remarkPanel:editRemarkPanel,
        options:isAdd?remarkOptions:editRemarkOptions,
        selectedEl:isAdd?remarkSelected:editRemarkSelected,
        selected:isAdd?addSelected:editSelected
    };
}
function setRemarkPanelOpen(which,open){
    const ctx=getRemarkContext(which);
    ctx.panel.classList.toggle('hidden',!open);
}
function closeRemarkPanels(){
    setRemarkPanelOpen('add',false);
    setRemarkPanelOpen('edit',false);
}
function renderRemarkCombo(which){
    const ctx=getRemarkContext(which);
    const selected=uniq(ctx.selected);
    if(which==='add')addSelected=selected;
    else editSelected=selected;

    const selectedKeys=new Set(selected.map(key));
    const query=key(ctx.input.value);
    // 已选项仍保留在下拉历史中；键入内容时按“包含”关系筛选候选项。
    // 使用与去重相同的规范化 key，兼容大小写和全/半角差异。
    const history=sortRemarks(state.remarks).filter(v=>!query||key(v).includes(query));

    ctx.options.innerHTML=history.length
        ? `<div class="remark-option-list">${history.map(v=>`
            <div class="remark-option-row" data-value="${attr(v)}">
                <button class="remark-option" type="button" data-action="select" data-value="${attr(v)}" aria-selected="${selectedKeys.has(key(v))?'true':'false'}">${selectedKeys.has(key(v))?'✓ ':''}${esc(v)}</button>
                <button class="remark-option-edit" type="button" data-action="edit" data-value="${attr(v)}">编辑</button>
                <button class="remark-option-delete" type="button" data-action="delete" data-value="${attr(v)}">删除</button>
            </div>
        `).join('')}</div>`
        : `<div class="remark-empty">${query?'没有包含该内容的备注':'暂无其它备注'}</div>`;

    ctx.selectedEl.innerHTML=selected.map(v=>`
        <span class="selected-remark">
            ${esc(v)}
            <button class="selected-remark-remove" type="button" data-value="${attr(v)}" aria-label="删除备注">×</button>
        </span>
    `).join('');
}
function commitRemark(which,value=null){
    const ctx=getRemarkContext(which);
    const remark=clean(value===null?ctx.input.value:value);
    if(!remark)return false;

    const selected=which==='add'?addSelected:editSelected;

    // 条目内部备注严格按输入/选择先后顺序保存。
    if(!selected.some(v=>key(v)===key(remark))){
        selected.push(remark);
    }

    // 下拉历史单独维护，仍按数字从小到大排序。
    addRemarkHistory(remark);

    if(which==='add')addSelected=uniq(selected);
    else editSelected=uniq(selected);

    // Enter 后输入框清空，刚确认的备注立即变成下方小方块。
    ctx.input.value='';
    renderRemarkCombo('add');
    renderRemarkCombo('edit');
    saveLocal();
    ctx.input.focus();
    return true;
}
function addHistoryRemarkToSelection(which,value){
    commitRemark(which,value);
    setRemarkPanelOpen(which,false);
}
function removeSelectedRemark(which,value){
    if(which==='add')addSelected=addSelected.filter(x=>key(x)!==key(value));
    else editSelected=editSelected.filter(x=>key(x)!==key(value));
    renderRemarkCombo(which);
}
function renameRemarkHistory(oldValue,newValue){
    const old=clean(oldValue),neu=clean(newValue);
    if(!neu){
        showToast('备注不能为空','error');
        return false;
    }
    if(key(neu)===key(old))return true;
    if(state.remarks.some(v=>key(v)===key(neu)&&key(v)!==key(old))){
        showToast('该备注已存在','error');
        return false;
    }

    // 修改后立即按下拉菜单既有数字排序规则重新排列。
    state.remarks=sortRemarks(state.remarks.map(v=>key(v)===key(old)?neu:v));
    for(const entry of state.entries){
        const renamed=orderedEntryRemarks(entry).map(v=>key(v)===key(old)?neu:v);
        entry.remarkOrder=uniq(renamed);
        entry.remarks=[...entry.remarkOrder];
    }
    addSelected=uniq(addSelected.map(v=>key(v)===key(old)?neu:v));
    editSelected=uniq(editSelected.map(v=>key(v)===key(old)?neu:v));

    saveLocal();
    render();
    markChange();
    showToast('已更新备注','success');
    return true;
}
function editRemarkHistoryOption(value){
    const oldValue=clean(value);
    if(!oldValue)return;
    const next=prompt('编辑备注：',oldValue);
    if(next===null)return;
    renameRemarkHistory(oldValue,next);
}
function deleteRemarkHistory(value){
    const v=clean(value);
    if(!confirm(`确定从备注下拉历史中删除“${v}”吗？

已有条目中的备注不会改变。`))return;
    state.remarks=sortRemarks(state.remarks.filter(x=>key(x)!==key(v)));
    saveLocal();
    renderRemarkCombo('add');
    renderRemarkCombo('edit');
    markChange();
    showToast('已删除备注历史','success');
}

// ---------- 总表 ----------
function render(){
    state=normalizeState(state);
    countDisplay.textContent=String(state.entries.length);

    const canManage=admin();
    tableBody.innerHTML=state.entries.length
        ? state.entries.map(item=>{
            const orderedRemarks=orderedEntryRemarks(item);
            const remarks=orderedRemarks.length
                ? `<div class="region-remarks">${orderedRemarks.map(v=>`<span class="region-remark">${esc(v)}</span>`).join('')}</div>`
                : '';
            const editLink=canManage
                ? `<button class="region-edit-link" data-id="${attr(item.id)}" type="button">编辑</button>`
                : '';
            return `<tr><td><div class="region-title-row"><div class="region-name">${esc(item.region)}</div>${editLink}</div>${remarks}</td></tr>`;
        }).join('')
        : `<tr class="empty-row"><td colspan="1">暂无条目</td></tr>`;

    updateAdminUI();
    renderRemarkCombo('add');
    renderRemarkCombo('edit');
    saveLocal();
}
function addEntry(){
    if(!admin()){showToast('请先配置并验证 Token','error');return}
    const region=clean(regionInput.value);
    if(!region){
        showToast('请输入区划','error');
        regionInput.focus();
        return;
    }

    if(clean(remarkInput.value))commitRemark('add');

    const remarks=uniq(addSelected);
    for(const remark of remarks)addRemarkHistory(remark);

    state.entries.push({
        id:uid(),
        region,
        remarks:[...remarks],
        remarkOrder:[...remarks]
    });

    regionInput.value='';
    remarkInput.value='';
    addSelected=[];
    closeRemarkPanels();
    render();
    markChange();
    regionInput.focus();
    showToast('已添加','success');
}
function getEditSnapshot(){
    return JSON.stringify({
        region:editRegion.value,
        remarkDraft:editRemarkInput.value,
        remarks:[...editSelected]
    });
}
function editIsUnchanged(){
    return Boolean(editingId)&&getEditSnapshot()===editInitialSnapshot;
}
function closeEdit(){
    editingId='';
    editInitialSnapshot='';
    editSelected=[];
    editRemarkInput.value='';
    closeRemarkPanels();
    editModal.classList.add('hidden');
}
function openEdit(id){
    if(!admin()){showToast('请先配置并验证 Token','error');return}
    const item=state.entries.find(x=>x.id===id);
    if(!item)return;
    closeRemarkPanels();
    editingId=id;
    editRegion.value=item.region;
    editRemarkInput.value='';
    editSelected=orderedEntryRemarks(item);
    renderRemarkCombo('edit');
    editInitialSnapshot=getEditSnapshot();
    editModal.classList.remove('hidden');
    setTimeout(()=>editRegion.focus(),30);
}
function saveEdit(){
    if(!admin()){showToast('请先配置并验证 Token','error');return}
    const item=state.entries.find(x=>x.id===editingId);
    if(!item)return;

    const region=clean(editRegion.value);
    if(!region){
        showToast('请输入区划','error');
        editRegion.focus();
        return;
    }

    if(clean(editRemarkInput.value))commitRemark('edit');

    const remarks=uniq(editSelected);
    for(const remark of remarks)addRemarkHistory(remark);

    item.region=region;
    item.remarkOrder=[...remarks];
    item.remarks=[...remarks];

    editingId='';
    editInitialSnapshot='';
    editSelected=[];
    editRemarkInput.value='';
    closeRemarkPanels();
    editModal.classList.add('hidden');
    render();
    markChange();
    showToast('已保存','success');
}
function deleteEntry(id){
    if(!admin()){showToast('请先配置并验证 Token','error');return false}
    const item=state.entries.find(x=>x.id===id);
    if(!item)return false;
    if(!confirm(`确定删除“${item.region}”吗？`))return false;
    state.entries=state.entries.filter(x=>x.id!==id);
    render();
    markChange();
    showToast('已删除','success');
    return true;
}

// ---------- Token 配置 ----------
function tokenId(){return crypto?.randomUUID?crypto.randomUUID():`token_${Date.now()}_${Math.random().toString(36).slice(2,9)}`}
function normalizeProfile(item){
    if(!item||typeof item!=='object')return null;
    const token=normalizeToken(item.token);
    if(!token)return null;
    return{
        id:clean(item.id)||tokenId(),
        name:clean(item.name),
        token,
        owner:clean(item.owner),
        repo:clean(item.repo),
        file:clean(item.file)||'region_data.json',
        updatedAt:clean(item.updatedAt)||new Date().toISOString()
    };
}
function loadProfiles(){
    const stored=lg(TOKEN_KEY);
    if(!stored)return[];
    try{
        const parsed=JSON.parse(stored);
        return Array.isArray(parsed)?parsed.map(normalizeProfile).filter(Boolean):[];
    }catch(e){return[]}
}
function saveProfiles(){ls(TOKEN_KEY,JSON.stringify(profiles))}
function profileLabel(profile,index){
    const suffix=profile.token.length>4?profile.token.slice(-4):profile.token;
    const target=[profile.owner,profile.repo].filter(Boolean).join('/');
    return profile.name||target||`Token ${index+1} ····${suffix}`;
}
function renderProfiles(preferred=selectedProfileId){
    cfgSavedToken.innerHTML='<option value="">新增 Token</option>';
    profiles.forEach((profile,index)=>{
        const option=document.createElement('option');
        option.value=profile.id;
        option.textContent=profileLabel(profile,index);
        cfgSavedToken.appendChild(option);
    });
    selectedProfileId=profiles.some(x=>x.id===preferred)?preferred:'';
    cfgSavedToken.value=selectedProfileId;
    cfgDeleteTokenBtn.disabled=!selectedProfileId;
}
function useProfile(id){
    selectedProfileId=id||'';
    const profile=profiles.find(x=>x.id===selectedProfileId);
    if(!profile)return;
    cfgTokenName.value=profile.name;
    cfgToken.value=profile.token;
    cfgOwner.value=profile.owner;
    cfgRepo.value=profile.repo;
    cfgFile.value=profile.file;
    cfgDeleteTokenBtn.disabled=false;
}
function newProfile(){
    selectedProfileId='';
    cfgSavedToken.value='';
    cfgTokenName.value='';
    cfgToken.value='';
    cfgOwner.value='';
    cfgRepo.value='';
    cfgFile.value='region_data.json';
    cfgDeleteTokenBtn.disabled=true;
}
function deleteProfile(){
    const profile=profiles.find(x=>x.id===selectedProfileId);
    if(!profile)return;
    if(!confirm(`确定从当前浏览器删除“${profileLabel(profile,0)}”吗？`))return;

    profiles=profiles.filter(x=>x.id!==profile.id);
    saveProfiles();

    if(config.activeTokenId===profile.id){
        config={token:'',tokenName:'',activeTokenId:'',owner:'',repo:'',file:'region_data.json'};
        saveConfigBase();
    }

    renderProfiles('');
    newProfile();
    updateSyncTime();
    setStatus(validConfig()?'online':'offline',validConfig()?'已配置':'未配置');
}
function upsertProfile(){
    const token=normalizeToken(cfgToken.value);
    const name=clean(cfgTokenName.value);
    const owner=clean(cfgOwner.value);
    const repo=clean(cfgRepo.value);
    const file=clean(cfgFile.value)||'region_data.json';

    let profile=profiles.find(x=>x.id===selectedProfileId)||profiles.find(x=>x.token===token);
    if(profile){
        Object.assign(profile,{name,token,owner,repo,file,updatedAt:new Date().toISOString()});
    }else{
        profile={id:tokenId(),name,token,owner,repo,file,updatedAt:new Date().toISOString()};
        profiles.push(profile);
    }

    selectedProfileId=profile.id;
    saveProfiles();
    renderProfiles(profile.id);
    return profile.id;
}
function saveConfigBase(){

// ---------- GitHub ----------
function apiErrorMessage(error){
    if(!error)return'未知错误';
    if(error.status===401)return'Token 无效、已过期或已撤销';
    if(error.status===403)return'Token 权限不足或仓库访问被拒绝';
    if(error.status===404)return'仓库、文件或路径不存在，或 Token 无权访问';
    if(error.status===409)return'云端文件已被其他设备修改';
    return error.message||String(error);
}
async function githubRequest(url,method='GET',body=null,tokenValue=config.token){
    const token=normalizeToken(tokenValue);
    if(!token){
        const error=new Error('Token 为空');
        error.status=401;
        throw error;
    }

    const headers={
        Authorization:`Bearer ${token}`,
        Accept:'application/vnd.github+json',
        'X-GitHub-Api-Version':API_VERSION
    };
    const options={method,headers,cache:'no-store'};

    if(body!==null){
        headers['Content-Type']='application/json';
        options.body=JSON.stringify(body);
    }

    const response=await fetch(url,options);
    const raw=await response.text();
    let payload=null;
    if(raw){
        try{payload=JSON.parse(raw)}
        catch(e){payload={message:raw}}
    }

    if(!response.ok){
        const error=new Error(payload?.message||`HTTP ${response.status}`);
        error.status=response.status;
        error.payload=payload;
        throw error;
    }
    return payload;
}
async function api(method,endpoint,body=null){
    const url=`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/${endpoint}`;
    return githubRequest(url,method,body,config.token);
}
async function verifyTokenAndRepo(token,owner,repo){
    const normalized=normalizeToken(token);
    const user=await githubRequest('https://api.github.com/user','GET',null,normalized);
    await githubRequest(
        `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,
        'GET',
        null,
        normalized
    );
    return{token:normalized,user};
}
function endpoint(){
    const path=pathEncode(config.file);
    if(!path)throw new Error('数据文件名不能为空');
    return`contents/${path}`;
}
async function readRemote(){
    try{
        const data=await api('GET',endpoint());
        if(!data||data.type!=='file'||data.encoding!=='base64'||typeof data.content!=='string'||!data.sha){
            throw new Error('云端文件无法安全读取');
        }
        if(Number.isFinite(data.size)&&data.size>MAX_SYNC)throw new Error('云端数据超过 750 KB');
        const parsed=JSON.parse(fromB64(data.content));
        const normalized=normalizeState(parsed);
        assertSize(normalized);
        return{exists:true,sha:data.sha,state:normalized};
    }catch(error){
        if(error.status===404)return{exists:false,sha:null,state:{entries:[],remarks:[]}};
        throw error;
    }
}
async function writeRemote(snapshot,sha){
    const normalized=normalizeState(snapshot);
    assertSize(normalized);
    const body={
        message:`更新 Region 数据 - ${new Date().toLocaleString()}`,
        content:toB64(JSON.stringify(normalized,null,2))
    };
    if(sha)body.sha=sha;
    const result=await api('PUT',endpoint(),body);
    return result?.content?.sha||null;
}

// ---------- 同步元数据 ----------
function emptyMeta(t=''){
    return{
        schemaVersion:1,
        target:t,
        remoteSha:null,
        lastSyncedFingerprint:null,
        lastSyncAt:null
    };
}
function loadMeta(){
    const stored=lg(META_KEY);
    if(!stored){meta=emptyMeta();return}
    try{
        const parsed=JSON.parse(stored);
        meta=parsed&&parsed.schemaVersion===1
            ? {
                schemaVersion:1,
                target:typeof parsed.target==='string'?parsed.target:'',
                remoteSha:typeof parsed.remoteSha==='string'?parsed.remoteSha:null,
                lastSyncedFingerprint:typeof parsed.lastSyncedFingerprint==='string'?parsed.lastSyncedFingerprint:null,
                lastSyncAt:typeof parsed.lastSyncAt==='string'?parsed.lastSyncAt:null
            }
            : emptyMeta();
    }catch(e){meta=emptyMeta()}
}
function saveMeta(){
    ls(META_KEY,JSON.stringify(meta));
    updateSyncTime();
}
function ensureTarget(){
    const t=target();
    if(meta.target!==t){
        meta=emptyMeta(t);
        saveMeta();
    }
}
function record(snapshot,sha){
    meta={
        schemaVersion:1,
        target:target(),
        remoteSha:sha||null,
        lastSyncedFingerprint:fingerprint(snapshot),
        lastSyncAt:new Date().toISOString()
    };
    saveMeta();
}
function updateSyncTime(){
    if(!meta.lastSyncAt||meta.target!==target()){
        lastSyncTime.textContent='未同步';
        return;
    }
    const date=new Date(meta.lastSyncAt);
    lastSyncTime.textContent=Number.isNaN(date.getTime())
        ? '已同步'
        : `已同步 ${date.toLocaleString()}`;
}

// ---------- 冲突备份 ----------
function backups(){
    const stored=lg(BACKUP_KEY);
    if(!stored)return[];
    try{
        const parsed=JSON.parse(stored);
        return Array.isArray(parsed)?parsed.filter(x=>x&&x.state).slice(-10):[];
    }catch(e){return[]}
}
function backup(snapshot,source){
    const list=backups();
    list.push({
        createdAt:new Date().toISOString(),
        source,
        target:target(),
        state:normalizeState(snapshot)
    });
    ls(BACKUP_KEY,JSON.stringify(list.slice(-10)));
}

// ---------- 同步 ----------
async function adoptRemote(expectedFingerprint,showResult){
    if(fingerprint(state)!==expectedFingerprint){
        syncQueued=true;
        return{ok:false,conflict:false};
    }

    const latest=await readRemote();
    if(!latest.exists){
        setStatus('offline','存在冲突');
        showToast('云端文件已删除，未覆盖本地数据','error');
        return{ok:false,conflict:true};
    }

    if(fingerprint(state)!==expectedFingerprint){
        syncQueued=true;
        return{ok:false,conflict:false};
    }

    backup(state,'before_remote_replace');
    state=latest.state;
    render();
    record(state,latest.sha);
    setStatus('online','公开阅读 · 管理已连接');
    if(showResult)showToast(`已从 GitHub 更新 ${state.entries.length} 个条目`,'success');
    return{ok:true,conflict:false};
}
async function performSync(showResult,interactive){
    ensureTarget();

    const local=normalizeState(state);
    assertSize(local);
    const localFp=fingerprint(local);
    const baseline=meta.lastSyncedFingerprint;
    const hasBaseline=typeof baseline==='string';
    const remote=await readRemote();

    if(!remote.exists&&hasBaseline){
        setStatus('offline','云端文件已删除');

        if(!interactive){
            showToast('云端数据文件已删除；请点击“同步”处理','error');
            return{ok:false,conflict:true};
        }

        if(!confirm('检测到云端 Region 数据文件已删除。\n\n确定：用当前本地数据重新创建云端文件。\n取消：保留本地数据。')){
            return{ok:false,conflict:true};
        }

        const latest=await readRemote();
        if(latest.exists){
            const error=new Error('确认期间云端文件已重新出现');
            error.status=409;
            throw error;
        }

        const sha=await writeRemote(local,null);
        record(local,sha);
        setStatus('online','公开阅读 · 管理已连接');
        showToast(`已重新创建云端文件并同步 ${local.entries.length} 个条目`,'success');
        return{ok:true,conflict:false,uploadedFingerprint:localFp};
    }

    if(!remote.exists){
        const sha=await writeRemote(local,null);
        record(local,sha);
        setStatus('online','公开阅读 · 管理已连接');
        if(showResult)showToast(`已创建云端文件并同步 ${local.entries.length} 个条目`,'success');
        return{ok:true,conflict:false,uploadedFingerprint:localFp};
    }

    const remoteFp=fingerprint(remote.state);

    if(localFp===remoteFp){
        record(local,remote.sha);
        setStatus('online','公开阅读 · 管理已连接');
        if(showResult)showToast('本地与云端已一致','success');
        return{ok:true,conflict:false};
    }

    const localChanged=!hasBaseline||localFp!==baseline;
    const remoteChanged=!hasBaseline||remoteFp!==baseline;

    if(hasBaseline&&localChanged&&!remoteChanged){
        const sha=await writeRemote(local,remote.sha);
        record(local,sha);
        setStatus('online','公开阅读 · 管理已连接');
        if(showResult)showToast(`成功同步 ${local.entries.length} 个条目到 GitHub`,'success');
        return{ok:true,conflict:false,uploadedFingerprint:localFp};
    }

    if(hasBaseline&&!localChanged&&remoteChanged){
        return adoptRemote(localFp,showResult);
    }

    if(!hasBaseline&&!hasStored){
        return adoptRemote(localFp,showResult);
    }

    setStatus('offline','存在冲突');

    if(!interactive){
        showToast('本地和云端都发生了修改；请点击“同步”选择版本','error');
        return{ok:false,conflict:true};
    }

    if(confirm('检测到同步冲突。\n\n确定：用本地数据覆盖云端。\n取消：继续选择是否采用云端数据。')){
        backup(remote.state,'remote_before_local_override');
        const sha=await writeRemote(local,remote.sha);
        record(local,sha);
        setStatus('online','公开阅读 · 管理已连接');
        showToast('已用本地数据覆盖云端','success');
        return{ok:true,conflict:false,uploadedFingerprint:localFp};
    }

    if(confirm('是否用最新云端数据覆盖本地？\n\n本地当前内容会保存为冲突备份。')){
        return adoptRemote(fingerprint(state),true);
    }

    showToast('已取消同步','info');
    return{ok:false,conflict:true};
}
async function sync(showResult=true,interactive=showResult){
    if(!validConfig()){
        showToast('请先配置 GitHub 连接','error');
        return false;
    }
    if(syncing){
        syncQueued=true;
        return false;
    }

    clearTimeout(autoTimer);
    autoTimer=null;
    syncing=true;
    syncBtn.disabled=true;
    setStatus('syncing','同步中…');

    let result={ok:false,conflict:false};

    try{
        result=await performSync(showResult,interactive);
    }catch(error){
        console.error(error);
        setStatus('offline',error.status===409?'存在冲突':'同步失败');
        showToast(`同步失败：${apiErrorMessage(error)}`,'error');

        if(error.status===401){
            config.token='';
            updateAdminUI();
            render();
        }
        if(error.status===409)result={ok:false,conflict:true};
    }finally{
        syncing=false;
        syncBtn.disabled=false;
    }

    if(result.uploadedFingerprint&&fingerprint(state)!==result.uploadedFingerprint){
        syncQueued=true;
    }

    if(syncQueued&&!result.conflict){
        syncQueued=false;
        setTimeout(()=>sync(false,false),0);
    }else if(result.conflict){
        syncQueued=false;
    }

    return result.ok;
}
function scheduleSync(){
    if(!validConfig())return;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{
        autoTimer=null;
        sync(false,false);
    },AUTO_DELAY);
}
function markChange(){
    saveLocal();
    if(validConfig()){
        setStatus('offline','待同步');
        lastSyncTime.textContent='有未同步修改';
    }
    scheduleSync();
}

// ---------- 管理员启动读取 ----------
async function loadAdminState(){
    // 管理员刷新时的数据权威顺序：
    // 1. 本地缓存：保护刚编辑但尚未同步的数据；
    // 2. GitHub Contents API：读取真正的云端最新文件；
    // 3. meta.lastSyncedFingerprint：判断哪一侧发生了修改。
    // 绝不读取公开 Pages 文件参与管理端同步判断。
    setStatus('syncing','正在读取管理数据…');
    ensureTarget();

    const cached=loadCachedState();
    hasStored=Boolean(lg(STATE_KEY));
    const baseline=meta.target===target()?meta.lastSyncedFingerprint:null;
    const hasBaseline=typeof baseline==='string';

    try{
        const remote=await readRemote();

        if(!remote.exists){
            if(cached){
                state=cached;
                render();
                setStatus('offline','管理已连接 · 云端文件不存在');
                lastSyncTime.textContent='已保留本地数据；请手动同步以决定是否创建云端文件';
            }else{
                state={entries:[],remarks:[]};
                render();
                setStatus('online','管理已连接');
                lastSyncTime.textContent='云端数据文件尚未创建';
            }
            return;
        }

        const remoteFp=fingerprint(remote.state);

        if(!cached){
            // 本地缓存不存在时，云端是唯一可靠来源。
            state=remote.state;
            render();
            record(state,remote.sha);
            setStatus('online','公开阅读 · 管理已连接');
            return;
        }

        const localFp=fingerprint(cached);

        if(localFp===remoteFp){
            // 本地和 GitHub 完全一致。
            state=cached;
            render();
            record(state,remote.sha);
            setStatus('online','公开阅读 · 管理已连接');
            return;
        }

        if(hasBaseline){
            const localChanged=localFp!==baseline;
            const remoteChanged=remoteFp!==baseline;

            if(localChanged&&!remoteChanged){
                // 只有本地变了：保留本地，并自动上传。
                state=cached;
                render();
                setStatus('offline','待同步');
                lastSyncTime.textContent='发现本地未同步修改';
                scheduleSync();
                return;
            }

            if(!localChanged&&remoteChanged){
                // 只有云端变了：采用 GitHub 最新数据。
                backup(cached,'before_startup_remote_replace');
                state=remote.state;
                render();
                record(state,remote.sha);
                setStatus('online','公开阅读 · 管理已连接');
                return;
            }

            if(localChanged&&remoteChanged){
                // 两边都变了：绝不自动覆盖任何一边。
                state=cached;
                render();
                setStatus('offline','存在同步冲突');
                lastSyncTime.textContent='本地和 GitHub 都有修改；请点击“同步”选择版本';
                showToast('检测到本地和 GitHub 都有修改，已保留本地数据，未自动覆盖任何内容','error');
                return;
            }
        }

        // 没有可靠基线且两边不同：同样禁止自动覆盖。
        state=cached;
        render();
        setStatus('offline','需要确认同步');
        lastSyncTime.textContent='本地与 GitHub 数据不同；请点击“同步”选择版本';
        showToast('本地与 GitHub 数据不同，已保留本地数据，请手动同步确认版本','info');
    }catch(error){
        console.error(error);

        if(error.status===401){
            // Token 失效时也不能让公开 Pages 文件覆盖管理缓存。
            config.token='';
            updateAdminUI();

            if(cached){
                state=cached;
                render();
                setStatus('offline','Token 已失效 · 本地数据已保护');
                lastSyncTime.textContent='已保留当前浏览器中的管理数据；重新配置 Token 后再同步';
                showToast('管理 Token 已失效；已保留本地数据，没有读取公开旧文件覆盖它','error');
            }else{
                await loadPublic();
                showToast('管理 Token 已失效，当前已切换为公开阅读','error');
            }
            return;
        }

        // 网络/API 异常时优先保留管理缓存，绝不以公开旧文件覆盖。
        if(cached){
            state=cached;
            render();
            setStatus('offline','管理云端暂不可用');
            lastSyncTime.textContent='已保留本地管理数据，未执行覆盖';
            showToast(`GitHub 管理数据读取失败：${apiErrorMessage(error)}；已保留本地数据`,'error');
        }else{
            setStatus('offline','管理云端读取失败');
            lastSyncTime.textContent='没有可恢复的本地管理数据';
            showToast(`GitHub 管理数据读取失败：${apiErrorMessage(error)}`,'error');
        }
    }
}

// ---------- 配置保存 ----------
async function saveConfig(event){
    event.preventDefault();

    const token=normalizeToken(cfgToken.value);
    const owner=clean(cfgOwner.value);
    const repo=clean(cfgRepo.value);
    const file=clean(cfgFile.value)||'region_data.json';

    if(!token){
        showToast('请输入 GitHub Token','error');
        cfgToken.focus();
        return;
    }
    if(!owner){
        showToast('请输入仓库所有者','error');
        cfgOwner.focus();
        return;
    }
    if(!repo){
        showToast('请输入仓库名称','error');
        cfgRepo.focus();
        return;
    }
    if(!file||file.endsWith('/')){
        showToast('请输入有效的数据文件名','error');
        cfgFile.focus();
        return;
    }

    const oldTarget=target();
    const oldText=configSave.textContent;
    configSave.disabled=true;
    configSave.textContent='正在验证…';
    setStatus('syncing','正在验证 Token…');

    try{
        const verified=await verifyTokenAndRepo(token,owner,repo);
        cfgToken.value=verified.token;

        config={
            token:verified.token,
            tokenName:clean(cfgTokenName.value),
            activeTokenId:'',
            owner,
            repo,
            file
        };
        config.activeTokenId=upsertProfile();
        saveConfigBase();

        if(oldTarget!==target()){
            meta=emptyMeta(target());
            saveMeta();
        }

        closeConfig();
        updateAdminUI();
        render();
        setStatus('online',`公开阅读 · 管理已连接 · ${verified.user.login}`);
        showToast(`Token 验证成功：${verified.user.login}`,'success');
        await sync(true,true);
    }catch(error){
        console.error(error);
        setStatus('offline',error.status===401?'Token 无效':'配置验证失败');
        showToast(`配置失败：${apiErrorMessage(error)}`,'error');
        cfgToken.focus();
    }finally{
        configSave.disabled=false;
        configSave.textContent=oldText;
    }
}

remarkInput.addEventListener('click',event=>{
    event.stopPropagation();
    setRemarkPanelOpen('edit',false);
    setRemarkPanelOpen('add',true);
    renderRemarkCombo('add');
});
editRemarkInput.addEventListener('click',event=>{
    event.stopPropagation();
    setRemarkPanelOpen('add',false);
    setRemarkPanelOpen('edit',true);
    renderRemarkCombo('edit');
});

remarkTrigger.addEventListener('click',event=>{
    event.stopPropagation();
    setRemarkPanelOpen('edit',false);
    setRemarkPanelOpen('add',remarkPanel.classList.contains('hidden'));
    renderRemarkCombo('add');
});
editRemarkTrigger.addEventListener('click',event=>{
    event.stopPropagation();
    setRemarkPanelOpen('add',false);
    setRemarkPanelOpen('edit',editRemarkPanel.classList.contains('hidden'));
    renderRemarkCombo('edit');
});

remarkInput.addEventListener('input',()=>{
    setRemarkPanelOpen('edit',false);
    setRemarkPanelOpen('add',true);
    renderRemarkCombo('add');
});
editRemarkInput.addEventListener('input',()=>{
    setRemarkPanelOpen('add',false);
    setRemarkPanelOpen('edit',true);
    renderRemarkCombo('edit');
});

remarkInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
        event.preventDefault();

        // 备注栏有内容：先把当前备注确认成标签；无论是新选项还是已有选项，
        // Enter 确认后都立即收起下拉，避免菜单继续遮挡后续操作。
        if(clean(remarkInput.value)){
            const committed=commitRemark('add');
            if(committed)setRemarkPanelOpen('add',false);
            return;
        }

        // 备注输入框为空时，说明当前备注选择已经完成。
        // 无论已选择一个还是多个备注，Enter 都直接等同点击主“添加”按钮。
        addEntry();
        closeRemarkPanels();
        regionInput.focus();
    }
});
editRemarkInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
        event.preventDefault();
        const hadMultiple=editSelected.length>1;
        const committed=clean(editRemarkInput.value)?commitRemark('edit'):false;
        // 编辑弹窗同样：Enter 提交任意备注后立即收起；空输入时多选确认也收起。
        if(committed||hadMultiple)setRemarkPanelOpen('edit',false);
    }
});

function handleRemarkOptionClick(event,which){
    const button=event.target.closest('[data-action][data-value]');
    if(!button)return;
    const action=button.dataset.action;
    const value=button.dataset.value;
    if(action==='select'){
        addHistoryRemarkToSelection(which,value);
        return;
    }
    event.preventDefault();
    event.stopPropagation();
    if(action==='edit')editRemarkHistoryOption(value);
    if(action==='delete')deleteRemarkHistory(value);
}
remarkOptions.addEventListener('click',event=>handleRemarkOptionClick(event,'add'));
editRemarkOptions.addEventListener('click',event=>handleRemarkOptionClick(event,'edit'));

remarkSelected.addEventListener('click',event=>{
    const button=event.target.closest('.selected-remark-remove[data-value]');
    if(button)removeSelectedRemark('add',button.dataset.value);
});
editRemarkSelected.addEventListener('click',event=>{
    const button=event.target.closest('.selected-remark-remove[data-value]');
    if(button)removeSelectedRemark('edit',button.dataset.value);
});

document.addEventListener('click',event=>{
    const addInsidePanel=remarkPanel.contains(event.target);
    const addOnInput=remarkInput.contains(event.target);
    const addOnTrigger=remarkTrigger.contains(event.target);

    const editInsidePanel=editRemarkPanel.contains(event.target);
    const editOnInput=editRemarkInput.contains(event.target);
    const editOnTrigger=editRemarkTrigger.contains(event.target);

    if(!addInsidePanel&&!addOnInput&&!addOnTrigger)setRemarkPanelOpen('add',false);
    if(!editInsidePanel&&!editOnInput&&!editOnTrigger)setRemarkPanelOpen('edit',false);
});

addBtn.addEventListener('click',addEntry);
regionInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
        event.preventDefault();
        addEntry();
    }
});

tableBody.addEventListener('click',event=>{
    const edit=event.target.closest('.region-edit-link[data-id]');
    if(edit)openEdit(edit.dataset.id);
});

editDelete.addEventListener('click',()=>{
    const id=editingId;
    if(!id)return;
    if(deleteEntry(id))closeEdit();
});
editCancel.addEventListener('click',closeEdit);
editSave.addEventListener('click',saveEdit);

// 只有按下和松开都发生在编辑框外的遮罩层本身，才算真正点击了编辑框外。
// 若编辑内容未发生任何变化，则关闭；有改动时保持编辑框打开。
editModal.addEventListener('pointerdown',event=>{
    editOverlayPointerDown=event.target===editModal;
});
editModal.addEventListener('pointerup',event=>{
    const outsideClick=editOverlayPointerDown&&event.target===editModal;
    editOverlayPointerDown=false;
    if(outsideClick&&editIsUnchanged())closeEdit();
});
editModal.addEventListener('pointercancel',()=>{
    editOverlayPointerDown=false;
});

configBtn.addEventListener('click',openConfig);
configCancel.addEventListener('click',closeConfig);
configForm.addEventListener('submit',saveConfig);
if(window.visualViewport){
    visualViewport.addEventListener('resize',()=>{
        if(!configModal.classList.contains('hidden'))syncConfigViewport();
    },{passive:true});
    visualViewport.addEventListener('scroll',()=>{
        if(!configModal.classList.contains('hidden'))syncConfigViewport();
    },{passive:true});
}
addEventListener('orientationchange',()=>{
    if(!configModal.classList.contains('hidden'))setTimeout(syncConfigViewport,50);
},{passive:true});
cfgSavedToken.addEventListener('change',()=>{
    cfgSavedToken.value?useProfile(cfgSavedToken.value):newProfile();
});
cfgNewTokenBtn.addEventListener('click',newProfile);
cfgDeleteTokenBtn.addEventListener('click',deleteProfile);

syncBtn.addEventListener('click',()=>sync(true,true));
exportBtn.addEventListener('click',downloadJson);
importBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{
    importFile(fileInput.files?.[0]);
    fileInput.value='';
});

document.addEventListener('keydown',event=>{
    if(event.key!=='Escape')return;

    if(!editModal.classList.contains('hidden')){
        closeEdit();
        return;
    }
    if(!configModal.classList.contains('hidden')){
        closeConfig();
        return;
    }
    closeRemarkPanels();
});

backToTopBtn.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
addEventListener('scroll',()=>{
    backToTopBtn.classList.toggle('visible',scrollY>260);
},{passive:true});

// ---------- 启动 ----------
loadMeta();
loadConfig();
updateAdminUI();
updateSyncTime();

if(validConfig()){
    loadAdminState();
}else{
    loadPublic();
}
})();
</script>
</body>
</html>
